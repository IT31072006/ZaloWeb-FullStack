{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập & Đăng ký - VKU NetChat (Socket TCP 5555)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>">
  <link rel="stylesheet" href="{% static 'css/zalo.css' %}">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(135deg, #0b3c6d 0%, #0068ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .auth-page-box {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.22);
      width: 100%;
      max-width: 440px;
      padding: 32px;
      box-sizing: border-box;
      overflow: hidden;
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 22px;
    }
    .auth-brand h1 {
      color: #0068ff;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 4px 0 0 0;
    }
    .auth-brand p {
      color: #64748b;
      font-size: 13.5px;
      margin: 6px 0 0 0;
    }
    .network-config-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
      width: 100%;
      box-sizing: border-box;
    }
    .form-group-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
      width: 100%;
      box-sizing: border-box;
    }
    .form-group-item label {
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .form-group-item input {
      width: 100% !important;
      max-width: 100% !important;
      min-width: 0 !important;
      box-sizing: border-box !important;
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group-item input:focus {
      border-color: #0068ff;
      box-shadow: 0 0 0 3px rgba(0, 104, 255, 0.15);
    }
    .back-home-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #0068ff;
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 600;
    }
    .back-home-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-page-box">
    <div class="auth-brand">
      <div style="font-size: 38px; line-height: 1;">🌐</div>
      <h1>VKU NetChat</h1>
      <p>Hệ thống Nhắn tin & Gọi thoại Bảo mật Socket TCP (LTM)</p>
    </div>

    <!-- Tabs -->
    <div style="display: flex; border-bottom: 2px solid #e8ecf2; margin-bottom: 20px;">
      <button class="tab-btn active" id="authTabLogin" style="flex:1; text-align:center; padding: 10px 0; font-size:15px;" onclick="switchAuthTab('login')">Đăng nhập</button>
      <button class="tab-btn" id="authTabRegister" style="flex:1; text-align:center; padding: 10px 0; font-size:15px;" onclick="switchAuthTab('register')">Đăng ký mới</button>
    </div>

    <form id="authPageForm" onsubmit="return false;">
      {% csrf_token %}
      <!-- Alert Message Box -->
      <div id="authAlertBox" style="display:none; padding:10px 14px; border-radius:8px; margin-bottom:14px; font-size:13px; font-weight:600; text-align:center;"></div>

      <!-- Network Server Config (Địa chỉ IP và Cổng Port môn Lập trình Mạng) -->
      <div class="network-config-grid">
        <div class="form-group-item">
          <label>Địa chỉ IP Máy chủ (Server IP)</label>
          <input type="text" id="authServerIp" value="127.0.0.1" placeholder="127.0.0.1 hoặc IP LAN">
        </div>
        <div class="form-group-item">
          <label>Cổng Port</label>
          <input type="text" id="authServerPort" value="5555" placeholder="5555">
        </div>
      </div>

      <div class="form-group-item" style="margin-bottom: 14px;">
        <label>Tên đăng nhập hoặc Số điện thoại</label>
        <input type="text" id="authUsername" placeholder="Nhập tài khoản" style="padding: 10px 14px;">
      </div>

      <div class="form-group-item" style="margin-bottom: 14px;">
        <label>Mật khẩu</label>
        <input type="password" id="authPassword" placeholder="Nhập mật khẩu" style="padding: 10px 14px;">
      </div>

      <div id="registerExtraFields" style="display:none; flex-direction:column; gap:14px; margin-bottom: 14px;">
        <div class="form-group-item">
          <label>Họ và tên hiển thị</label>
          <input type="text" id="regDisplayName" placeholder="Ví dụ: Phạm Huỳnh Quân" style="padding: 10px 14px;">
        </div>
        <div class="form-group-item">
          <label>Số điện thoại</label>
          <input type="text" id="regPhone" placeholder="Ví dụ: 0901234567" style="padding: 10px 14px;">
        </div>
        <div class="form-group-item">
          <label>Ảnh đại diện (Tùy chọn)</label>
          <input type="file" id="regAvatarInput" accept="image/*">
        </div>
      </div>

      <button type="button" class="btn-primary" id="btnSubmitAuth" onclick="handleAuthSubmit()" style="width: 100%; padding: 12px; font-size: 15px; margin-top: 8px;">
        Đăng nhập
      </button>

      <div style="margin-top: 18px; background: #f7f9fa; padding: 12px; border-radius: 8px; font-size: 12px;">
        <span style="font-weight:600; color:#555;">Đăng nhập nhanh (1-Click):</span>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;">
          <button type="button" class="btn-secondary" style="padding: 5px 10px;" onclick="quickLogin('quan')">Quân</button>
          <button type="button" class="btn-secondary" style="padding: 5px 10px;" onclick="quickLogin('camnt')">Cô Camnt</button>
          <button type="button" class="btn-secondary" style="padding: 5px 10px;" onclick="quickLogin('bao')">Bảo</button>
          <button type="button" class="btn-secondary" style="padding: 5px 10px;" onclick="quickLogin('phuc')">Phúc</button>
        </div>
      </div>
    </form>

    <a href="/" class="back-home-link">← Quay lại trang chat chính</a>
  </div>

  <div class="zalo-toast-container" id="toastContainer"></div>
  <script src="{% static 'js/zalo.js' %}?v=20261124_v1"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Luôn đặt mặc định IP là 127.0.0.1 và Cổng Port Socket TCP là 5555
      const ipInput = document.getElementById('authServerIp');
      const portInput = document.getElementById('authServerPort');
      if (ipInput) {
        const savedIp = localStorage.getItem('vku_server_ip') || localStorage.getItem('zalo_server_ip') || '127.0.0.1';
        ipInput.value = savedIp;
      }
      if (portInput) {
        const savedPort = localStorage.getItem('vku_server_port') || localStorage.getItem('zalo_server_port');
        // Luôn giữ cổng mặc định là 5555 của Server TCP LTM, loại trừ port 48000 của Webview hoặc 8000 cũ
        portInput.value = (savedPort && savedPort !== '48000' && savedPort !== '8000') ? savedPort : '5555';
      }

      // Hỗ trợ phím Enter để gửi Form
      ['authUsername', 'authPassword', 'regDisplayName', 'regPhone'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              handleAuthSubmit();
            }
          });
        }
      });
    });
  </script>
</body>
</html>
